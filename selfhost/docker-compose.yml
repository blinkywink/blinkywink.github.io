# Postgres + PostgREST only. Host Caddy (already on :80/:443) fronts
# https://api.blinkywink.co — see caddy.snippet / README.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: monkeycards
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monkeycards"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 128mb

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@postgres:5432/monkeycards
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_PRE_REQUEST: public.pgrst_pre_request
      PGRST_OPENAPI_MODE: disabled
      PGRST_MAX_ROWS: 1000
      PGRST_DB_POOL: "20"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "10"
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  pgdata:

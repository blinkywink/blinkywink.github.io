name: iOS sideload IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-*"

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build web + sync Capacitor iOS
        run: npm run mobile:sync

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build unsigned IPA
        run: npm run mobile:ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MonkeyCards-ios-sideload
          path: |
            ios-artifacts/MonkeyCards.ipa
            ios-artifacts/README.txt
          if-no-files-found: error
          retention-days: 14

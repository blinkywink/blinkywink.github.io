name: iOS sideload IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-*"

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Sync iOS version from mobile native version
        run: npx tsx -e 'import { writeMobileNativeVersion, readMobileNativeVersion } from "./scripts/desktop-version.ts"; writeMobileNativeVersion(readMobileNativeVersion());'

      - name: Build web + sync Capacitor iOS
        run: npm run mobile:sync

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build unsigned IPA
        run: npm run mobile:ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MonkeyCards-ios-sideload
          path: |
            ios-artifacts/MonkeyCards.ipa
            ios-artifacts/README.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish to mobile release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/publish-mobile-asset.ts ios-artifacts/MonkeyCards.ipa

name: Mobile OTA web bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "!public/mobile-latest.json"
      - "index.html"
      - "package.json"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - "scripts/publish-mobile-ota.ts"
      - "scripts/ota-bundle.ts"
      - "scripts/write-slim-ota-zip.py"
      - "scripts/write-baked-ota-checksum.ts"
      - ".github/workflows/mobile-ota.yml"

concurrency:
  group: mobile-ota
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Publish OTA web zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/publish-mobile-ota.ts

      # Release asset is the source of truth (apps check GitHub first).
      # Site mirror is best-effort so concurrent pushes don't fail the job.
      - name: Mirror mobile-latest.json on the site
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MANIFEST="$(mktemp)"
          cp public/mobile-latest.json "$MANIFEST"
          git fetch origin main
          git checkout -B main origin/main
          cp "$MANIFEST" public/mobile-latest.json
          cp "$MANIFEST" mobile-latest.json
          git add public/mobile-latest.json mobile-latest.json
          if git diff --staged --quiet; then
            echo "No manifest changes"
            exit 0
          fi
          git commit -m "chore: sync mobile-latest OTA manifest"
          git push origin HEAD:main

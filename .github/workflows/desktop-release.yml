name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --bundles dmg
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Monkey Cards ${{ github.ref_name }}"
          releaseBody: "Desktop update. The app installs this on next launch, then restarts."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize assets + writer updater latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npx tsx scripts/finalize-desktop-release.ts
      - name: Commit desktop-latest.json for the site mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/desktop-latest.json public/desktop-config.json
          if git diff --staged --quiet; then
            echo "No manifest changes"
          else
            git commit -m "chore: sync desktop-latest for ${{ github.ref_name }}"
            git push origin HEAD:main
          fi

  cleanup-old-releases:
    needs: finalize
    runs-on: ubuntu-latest
    steps:
      - name: Delete older desktop (v*) releases only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep="${{ github.ref_name }}"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '.[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$keep" ] && continue
            # Never delete the rolling mobile sideload release / other tags
            case "$tag" in
              v[0-9]*) ;;
              *) echo "Keeping non-desktop tag $tag"; continue ;;
            esac
            echo "Deleting old desktop release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
